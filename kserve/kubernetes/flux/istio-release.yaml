# =============================================================================
# Flux HelmReleases - Istio (base, control plane, ingress gateway)
# Required by Knative Serving (net-istio) and KServe (ingress)
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
  labels:
    app.kubernetes.io/managed-by: flux
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: istio-system
spec:
  interval: 5m
  chart:
    spec:
      chart: base
      version: "1.29.2"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  values:
    defaultRevision: default
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: istio-system
spec:
  interval: 5m
  dependsOn:
    - name: istio-base
      namespace: istio-system
  chart:
    spec:
      chart: istiod
      version: "1.29.2"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  values:
    # KServe + Knative do not need automatic sidecar injection on user pods
    pilot:
      podAnnotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
      nodeSelector:
        workload: system
    proxy:
      autoInject: disabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-ingressgateway
  namespace: istio-system
spec:
  interval: 5m
  dependsOn:
    - name: istiod
      namespace: istio-system
  chart:
    spec:
      chart: gateway
      version: "1.29.2"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  values:
    podAnnotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    nodeSelector:
      workload: system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
