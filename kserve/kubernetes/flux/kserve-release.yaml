# =============================================================================
# Flux HelmReleases - KServe CRDs + controller (Serverless / Knative mode)
# Depends on: cert-manager, Istio, Knative Serving (installed post-Flux)
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: kserve
  labels:
    app.kubernetes.io/managed-by: flux
---
# CRDs first — controller chart depends on these
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kserve-crd
  namespace: kserve
spec:
  interval: 5m
  chart:
    spec:
      chart: kserve-crd
      version: "v0.18.0"
      sourceRef:
        kind: HelmRepository
        name: kserve
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kserve-resources
  namespace: kserve
spec:
  interval: 5m
  dependsOn:
    - name: kserve-crd
      namespace: kserve
    - name: cert-manager
      namespace: cert-manager
    - name: istiod
      namespace: istio-system
  chart:
    spec:
      chart: kserve-resources
      version: "v0.18.0"
      sourceRef:
        kind: HelmRepository
        name: kserve
        namespace: flux-system
  values:
    kserve:
      controller:
        deploymentMode: "Serverless"
        nodeSelector:
          workload: system
      modelmesh:
        enabled: false
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
---
# Serving runtimes (HuggingFace, sklearn, xgboost, triton, etc.)
# Split out of kserve-resources in v0.18 - must be installed separately
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kserve-runtime-configs
  namespace: kserve
spec:
  interval: 5m
  dependsOn:
    - name: kserve-resources
      namespace: kserve
  chart:
    spec:
      chart: kserve-runtime-configs
      version: "v0.18.0"
      sourceRef:
        kind: HelmRepository
        name: kserve
        namespace: flux-system
  values:
    kserve:
      version: "v0.18.0"
      servingruntime:
        enabled: true
      llmisvcConfigs:
        enabled: false
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
