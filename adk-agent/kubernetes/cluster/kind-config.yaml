# =============================================================================
# Kind cluster for the adk-k8s-agent demo
# 1 control-plane + 1 worker. Cilium CNI, no kube-proxy.
#
# Sizing: the cluster sits at ~1.5 GB resident with the agent + ESO running.
# 4 GB RAM allocated to Docker Desktop is plenty.
# =============================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: adk-agent
networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
  disableDefaultCNI: true
  kubeProxyMode: "none"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraMounts:
      - hostPath: /tmp/adk-agent/control-plane
        containerPath: /var/local-path-provisioner

  - role: worker
    labels:
      workload: system
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload=system"
    extraMounts:
      - hostPath: /tmp/adk-agent/worker-system
        containerPath: /var/local-path-provisioner
