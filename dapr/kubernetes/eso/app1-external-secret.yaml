# =============================================================================
# ExternalSecret for app1 — pulls secrets from Vault path secret/dapr/app1
# Creates a K8s Secret in app1-ns that Dapr components can reference
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: app1-ns
  labels:
    app.kubernetes.io/name: app1
    app.kubernetes.io/managed-by: taskfile
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app1-secrets
  namespace: app1-ns
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: app1-secrets
    creationPolicy: Owner
  data:
    - secretKey: slack-bot-token
      remoteRef:
        key: dapr/app1
        property: slack-bot-token
    - secretKey: slack-app-token
      remoteRef:
        key: dapr/app1
        property: slack-app-token
    - secretKey: anthropic-api-key
      remoteRef:
        key: dapr/app1
        property: anthropic-api-key
