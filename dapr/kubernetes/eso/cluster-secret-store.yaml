# =============================================================================
# ClusterSecretStore — connects ESO to Vault (dev mode)
# Uses a static token for the demo; production should use Kubernetes auth.
# =============================================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-token
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/managed-by: taskfile
type: Opaque
stringData:
  token: "demo-root-token"
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault-system:8200"
      path: "secret"
      version: "v2"
      auth:
        tokenSecretRef:
          name: "vault-token"
          namespace: "external-secrets"
          key: "token"
