# =============================================================================
# ExternalSecret for app2 — pulls secrets from Vault path secret/dapr/app2
# Creates a K8s Secret in app2-ns that Dapr components can reference
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: app2-ns
  labels:
    app.kubernetes.io/name: app2
    app.kubernetes.io/managed-by: taskfile
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app2-secrets
  namespace: app2-ns
spec:
  refreshInterval: "1m"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: app2-secrets
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: dapr/app2
        property: api-key
    - secretKey: db-connection
      remoteRef:
        key: dapr/app2
        property: db-connection
