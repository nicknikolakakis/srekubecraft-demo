# =============================================================================
# Flux HelmRelease — Dapr runtime (HA mode)
# Depends on: ESO (so Dapr components can reference K8s secrets)
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: dapr-system
  labels:
    app.kubernetes.io/managed-by: flux
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dapr
  namespace: dapr-system
spec:
  interval: 5m
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
  chart:
    spec:
      chart: dapr
      version: ">=1.17.0"
      sourceRef:
        kind: HelmRepository
        name: dapr
        namespace: flux-system
  values:
    global:
      ha:
        enabled: true
      logAsJson: true
      mtls:
        enabled: true
      prometheus:
        enabled: true
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
