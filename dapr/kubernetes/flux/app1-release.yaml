# =============================================================================
# Flux HelmRelease — App1 (Message Classifier)
# Citizen developer provided: image, port, statestore, secretstore config
# Platform team wraps it in a Flux HelmRelease pulling from Harbor
# =============================================================================
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: app1
  namespace: app1-ns
spec:
  interval: 5m
  chart:
    spec:
      chart: app
      version: ">=0.1.0"
      sourceRef:
        kind: HelmRepository
        name: harbor-platform
        namespace: flux-system
  values:
    image:
      repository: localhost:30000/platform/dapr-app1
      tag: latest
      pullPolicy: IfNotPresent

    port: 8080

    nodepool: app1

    # Allow app2 to call this app via Dapr service invocation
    networkPolicy:
      enabled: true
      allowIngressFrom:
        - app2-ns

    # Dapr state store — save classifications to Redis (via Dapr API)
    statestore:
      enabled: true
      redis:
        host: "redis.redis-system.svc.cluster.local:6379"

    # Dapr secret store — read secrets from Vault (via Dapr API)
    secretstore:
      enabled: true
      vault:
        address: "http://vault.vault-system.svc.cluster.local:8200"
        secretsPath: "dapr/app1"
        tokenSecret:
          name: "vault-access"
          key: "token"

  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
