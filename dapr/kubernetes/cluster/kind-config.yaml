# =============================================================================
# Kind cluster configuration for Dapr citizen-developer platform demo
# 4 nodes: 1 control-plane + 3 workers (system, app1, app2)
# Cilium CNI, no kube-proxy — simulates dedicated GKE nodepools
# =============================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dapr-citizen-dev
networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
  # Disable default CNI — Cilium will be installed as the CNI
  disableDefaultCNI: true
  # Disable kube-proxy — Cilium replaces it with eBPF
  kubeProxyMode: "none"
nodes:
  # --- Control Plane ---
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            audit-log-path: /var/log/kubernetes/audit.log
            audit-log-maxage: "7"
            audit-log-maxbackup: "3"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
    extraMounts:
      - hostPath: /tmp/dapr-citizen-dev/control-plane
        containerPath: /var/local-path-provisioner

  # --- Worker 1: System (Dapr control plane, Vault, monitoring) ---
  - role: worker
    labels:
      workload: system
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload=system"
    extraMounts:
      - hostPath: /tmp/dapr-citizen-dev/worker-system
        containerPath: /var/local-path-provisioner

  # --- Worker 2: app1 (simulates dedicated GKE nodepool) ---
  - role: worker
    labels:
      workload: apps
      app: app1
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload=apps,app=app1"
          taints:
            - key: "app"
              value: "app1"
              effect: "NoSchedule"
    extraMounts:
      - hostPath: /tmp/dapr-citizen-dev/worker-app1
        containerPath: /var/local-path-provisioner

  # --- Worker 3: app2 (simulates dedicated GKE nodepool) ---
  - role: worker
    labels:
      workload: apps
      app: app2
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload=apps,app=app2"
          taints:
            - key: "app"
              value: "app2"
              effect: "NoSchedule"
    extraMounts:
      - hostPath: /tmp/dapr-citizen-dev/worker-app2
        containerPath: /var/local-path-provisioner
