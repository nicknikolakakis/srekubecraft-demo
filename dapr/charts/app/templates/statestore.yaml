{{- if .Values.statestore.enabled }}
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ include "app.name" . }}-statestore
  namespace: {{ include "app.namespace" . }}
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: {{ .Values.statestore.redis.host | quote }}
    - name: redisPassword
      value: ""
    - name: keyPrefix
      value: {{ include "app.name" . | quote }}
scopes:
  - {{ include "app.name" . }}
{{- end }}
