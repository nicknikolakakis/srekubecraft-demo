apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "app.name" . }}-quota
  namespace: {{ include "app.namespace" . }}
spec:
  hard:
    requests.cpu: {{ .Values.quota.requests.cpu | quote }}
    requests.memory: {{ .Values.quota.requests.memory | quote }}
    limits.cpu: {{ .Values.quota.limits.cpu | quote }}
    limits.memory: {{ .Values.quota.limits.memory | quote }}
    pods: {{ .Values.quota.maxPods | quote }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "app.name" . }}-limits
  namespace: {{ include "app.namespace" . }}
spec:
  limits:
    - default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 64Mi
      type: Container
