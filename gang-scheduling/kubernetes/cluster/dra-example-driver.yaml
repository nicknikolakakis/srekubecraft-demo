# Source: dra-example-driver/templates/kubeletplugin.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dra-example-driver-kubeletplugin
  namespace: dra-example-driver
  labels:
    helm.sh/chart: dra-example-driver-0.0.0-dev
    app.kubernetes.io/name: dra-example-driver
    app.kubernetes.io/instance: dra-example-driver
    app.kubernetes.io/version: "v0.5.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: kubeletplugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dra-example-driver
      app.kubernetes.io/instance: dra-example-driver
      app.kubernetes.io/component: kubeletplugin
  updateStrategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dra-example-driver
        app.kubernetes.io/instance: dra-example-driver
        app.kubernetes.io/component: kubeletplugin
    spec:
      priorityClassName: system-node-critical
      serviceAccountName: dra-example-driver-service-account
      securityContext:
        {}
      containers:
      - name: plugin
        securityContext:
          privileged: true
        image: registry.k8s.io/dra-example-driver/dra-example-driver:v0.5.0
        imagePullPolicy: IfNotPresent
        command: ["dra-example-kubeletplugin"]
        resources:
          {}
        
        livenessProbe:
          grpc:
            port: 51515
            service: liveness
          failureThreshold: 3
          periodSeconds: 10
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        env:
        - name: DRIVER_NAME
          value: "gpu.example.com"
        - name: DEVICE_PROFILE
          value: "gpu"
        - name: CDI_ROOT
          value: /var/run/cdi
        - name: KUBELET_REGISTRAR_DIRECTORY_PATH
          value: "/var/lib/kubelet/plugins_registry"
        - name: KUBELET_PLUGINS_DIRECTORY_PATH
          value: "/var/lib/kubelet/plugins"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: DEVICE_HEALTH
          value: "true"
        - name: SIMULATE_HEALTH_CHANGES
          value: "false"
        # Simulated number of devices the example driver will pretend to have.
        - name: NUM_DEVICES
          value: "2"
        - name: GPU_DEVICE_STATUS
          value: "false"
        - name: GPU_ALLOW_MULTIPLE_ALLOCATIONS
          value: "false"
        - name: GPU_PUBLISH_PCIE_ROOT
          value: "false"
        - name: NET_PUBLISH_PCIE_ROOT
          value: "false"
        - name: PCIE_ROOTS
          value: ""
        - name: HEALTHCHECK_PORT
          value: "51515"
        - name: METRICS_PORT
          value: "8080"
        - name: GPU_PARTITIONS
          value: "0"
        - name: CPU_NUMA_NODES
          value: "8"
        - name: CPUS_PER_NUMA_NODE
          value: "4"
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: BINDING_CONDITIONS
          value: "false"
        volumeMounts:
        - name: plugins-registry
          mountPath: "/var/lib/kubelet/plugins_registry"
        - name: plugins
          mountPath: "/var/lib/kubelet/plugins"
        - name: cdi
          mountPath: /var/run/cdi
      volumes:
      - name: plugins-registry
        hostPath:
          path: "/var/lib/kubelet/plugins_registry"
      - name: plugins
        hostPath:
          path: "/var/lib/kubelet/plugins"
      - name: cdi
        hostPath:
          path: /var/run/cdi

