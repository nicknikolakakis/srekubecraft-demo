---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: one-gpu
  namespace: ml-team
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.example.com
            allocationMode: ExactCount
            count: 1
---
apiVersion: batch/v1
kind: Job
metadata:
  name: train-a
  namespace: ml-team
  labels:
    app.kubernetes.io/name: train-a
spec:
  completions: 4
  parallelism: 4
  backoffLimit: 0
  completionMode: Indexed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: train-a
    spec:
      restartPolicy: Never
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: one-gpu
      containers:
        - name: rank
          image: registry.k8s.io/e2e-test-images/busybox@sha256:0ffbe172f8d245c83f285c6992b452c53d085661e03ddfd3b484332026e6c8bb
          command: ["sh", "-c", "echo rank $JOB_COMPLETION_INDEX holding a GPU; sleep 3600"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
            claims:
              - name: gpu
---
apiVersion: batch/v1
kind: Job
metadata:
  name: train-b
  namespace: ml-team
  labels:
    app.kubernetes.io/name: train-b
spec:
  completions: 4
  parallelism: 4
  backoffLimit: 0
  completionMode: Indexed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: train-b
    spec:
      restartPolicy: Never
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: one-gpu
      containers:
        - name: rank
          image: registry.k8s.io/e2e-test-images/busybox@sha256:0ffbe172f8d245c83f285c6992b452c53d085661e03ddfd3b484332026e6c8bb
          command: ["sh", "-c", "echo rank $JOB_COMPLETION_INDEX holding a GPU; sleep 3600"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
            claims:
              - name: gpu
