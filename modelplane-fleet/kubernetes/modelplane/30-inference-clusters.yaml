# Two BYO clusters, registered by kubeconfig; the region labels are what a clusterSelector matches on.
apiVersion: modelplane.ai/v1alpha1
kind: InferenceCluster
metadata:
  name: gpu-eu-west
  labels:
    modelplane.ai/region: eu-west
spec:
  cluster:
    source: Existing
    existing:
      secretRef:
        name: eu-west-kubeconfig
        key: kubeconfig
  nodePools:
  - name: gpu-eu-west
    className: synthetic-gpu
    nodeCount: 1
---
apiVersion: modelplane.ai/v1alpha1
kind: InferenceCluster
metadata:
  name: gpu-us-east
  labels:
    modelplane.ai/region: us-east
spec:
  cluster:
    source: Existing
    existing:
      secretRef:
        name: us-east-kubeconfig
        key: kubeconfig
  nodePools:
  - name: gpu-us-east
    className: synthetic-gpu
    nodeCount: 1
