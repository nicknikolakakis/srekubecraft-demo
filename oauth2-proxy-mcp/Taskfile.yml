version: "3"
silent: true

vars:
  CLUSTER_NAME: oauth2-proxy-mcp-demo
  CILIUM_VERSION: "1.19.0"
  OAUTH2_PROXY_VERSION: "v7.15.1"

tasks:
  # ===========================================================================
  # Pre-flight checks
  # ===========================================================================
  check:
    desc: Verify required tools are installed
    cmds:
      - |
        echo "Checking required tools..."
        for cmd in kind kubectl helm cilium openssl jq; do
          if ! command -v $cmd &> /dev/null; then
            echo "ERROR: $cmd is not installed"
            exit 1
          fi
        done
        echo "All tools found."

  # ===========================================================================
  # Cluster lifecycle
  # ===========================================================================
  cluster:create:
    desc: Create Kind cluster with Cilium CNI
    cmds:
      - echo "Creating Kind cluster '{{.CLUSTER_NAME}}'..."
      - kind create cluster --config kubernetes/cluster/kind-config.yaml --wait 60s
      - echo "Cluster created."
    status:
      - kind get clusters 2>/dev/null | grep -q "{{.CLUSTER_NAME}}"

  cluster:delete:
    desc: Delete Kind cluster
    cmds:
      - echo "Deleting Kind cluster '{{.CLUSTER_NAME}}'..."
      - kind delete cluster --name {{.CLUSTER_NAME}}
      - echo "Cluster deleted."

  # ===========================================================================
  # Cilium CNI
  # ===========================================================================
  cilium:install:
    desc: Install Cilium as the CNI
    deps: [cluster:create]
    cmds:
      - echo "Installing Cilium {{.CILIUM_VERSION}}..."
      - helm repo add cilium https://helm.cilium.io/ 2>/dev/null || true
      - helm repo update cilium
      - >-
        helm upgrade --install cilium cilium/cilium
        --version {{.CILIUM_VERSION}}
        --namespace kube-system
        --set image.pullPolicy=IfNotPresent
        --set ipam.mode=kubernetes
        --set kubeProxyReplacement=true
        --set securityContext.capabilities.ciliumAgent="{CHOWN,KILL,NET_ADMIN,NET_RAW,IPC_LOCK,SYS_ADMIN,SYS_RESOURCE,DAC_OVERRIDE,FOWNER,SETGID,SETUID}"
        --set securityContext.capabilities.cleanCiliumState="{NET_ADMIN,SYS_ADMIN,SYS_RESOURCE}"
        --set cgroup.autoMount.enabled=false
        --set cgroup.hostRoot=/sys/fs/cgroup
        --set k8sServiceHost={{.CLUSTER_NAME}}-control-plane
        --set k8sServicePort=6443
        --set hubble.relay.enabled=true
        --set hubble.ui.enabled=true
        --wait --timeout 5m
      - cilium status --wait
      - kubectl wait --for=condition=Ready nodes --all --timeout=120s
      - echo "Cilium installed. All nodes ready."
    status:
      - helm list -n kube-system 2>/dev/null | grep -q cilium

  # ===========================================================================
  # Infrastructure: Namespaces + Redis + PostgreSQL
  # ===========================================================================
  infra:namespaces:
    desc: Create namespaces
    cmds:
      - kubectl apply -f kubernetes/oauth2-proxy/01-namespace.yaml
      - kubectl apply -f kubernetes/dbhub/01-namespace.yaml

  infra:redis:
    desc: Deploy Redis for session storage
    deps: [infra:namespaces]
    cmds:
      - echo "Deploying Redis..."
      - kubectl apply -f kubernetes/redis/01-deployment.yaml
      - kubectl wait --for=condition=available deployment/redis -n mcp-auth --timeout=60s
      - echo "Redis ready."

  infra:postgres:
    desc: Deploy PostgreSQL with sample data
    deps: [infra:namespaces]
    cmds:
      - echo "Deploying PostgreSQL with sample data..."
      - kubectl apply -f kubernetes/postgres/01-deployment.yaml
      - kubectl wait --for=condition=available deployment/postgres -n mcp-auth --timeout=120s
      - echo "Waiting for init scripts to complete..."
      - sleep 5
      - echo "PostgreSQL ready."

  # ===========================================================================
  # OAuth2-Proxy secret (interactive)
  # ===========================================================================
  oauth2-proxy:secret:
    desc: Create OAuth2-Proxy secret (interactive)
    deps: [infra:namespaces]
    cmds:
      - |
        echo "=== OAuth2-Proxy Secret Setup ==="
        echo ""
        echo "You need a GitHub OAuth App. Create one at:"
        echo "  https://github.com/settings/developers"
        echo ""
        echo "  Homepage URL:     http://dbhub.localhost"
        echo "  Callback URL:     http://dbhub.localhost/oauth2/callback"
        echo ""
        read -p "GitHub OAuth Client ID: " CLIENT_ID
        read -s -p "GitHub OAuth Client Secret: " CLIENT_SECRET
        echo ""
        COOKIE_SECRET=$(openssl rand -base64 24)
        echo ""
        echo "Generated cookie secret."
        echo ""
        # Create in mcp-auth (for centralized Redis sessions)
        kubectl create secret generic oauth2-proxy-secret \
          --from-literal=client-id="$CLIENT_ID" \
          --from-literal=client-secret="$CLIENT_SECRET" \
          --from-literal=cookie-secret="$COOKIE_SECRET" \
          --namespace mcp-auth \
          --dry-run=client -o yaml | kubectl apply -f -
        # Copy to mcp-servers (for sidecar pattern)
        kubectl create secret generic oauth2-proxy-secret \
          --from-literal=client-id="$CLIENT_ID" \
          --from-literal=client-secret="$CLIENT_SECRET" \
          --from-literal=cookie-secret="$COOKIE_SECRET" \
          --namespace mcp-servers \
          --dry-run=client -o yaml | kubectl apply -f -
        echo "Secrets created in mcp-auth and mcp-servers namespaces."

  # ===========================================================================
  # DBHub + OAuth2-Proxy sidecar
  # ===========================================================================
  dbhub:secret:
    desc: Create DBHub database connection secret
    deps: [infra:namespaces]
    cmds:
      - kubectl apply -f kubernetes/dbhub/02-secret.yaml
      - echo "DBHub secret created."

  dbhub:deploy:
    desc: Deploy DBHub with OAuth2-Proxy sidecar
    deps: [dbhub:secret, infra:postgres, infra:redis]
    cmds:
      - echo "Deploying DBHub with OAuth2-Proxy sidecar..."
      - kubectl apply -f kubernetes/dbhub/03-sidecar-deployment.yaml
      - kubectl wait --for=condition=available deployment/dbhub-sidecar -n mcp-servers --timeout=120s
      - echo "DBHub (sidecar) ready."

  # ===========================================================================
  # NetworkPolicy demo
  # ===========================================================================
  demo:netpol:
    desc: Apply NetworkPolicies for MCP server isolation
    cmds:
      - kubectl apply -f kubernetes/policies/01-dbhub-isolation.yaml
      - |
        echo ""
        echo "=== NetworkPolicies Applied ==="
        echo ""
      - kubectl get networkpolicies -n mcp-servers
      - |
        echo ""
        echo "DBHub can only be reached via the OAuth2-Proxy sidecar (port 4180)."
        echo "Direct access to port 8080 from other namespaces is now blocked."

  # ===========================================================================
  # Full setup
  # ===========================================================================
  setup:
    desc: Full setup - cluster, infra, and DBHub with OAuth2-Proxy
    cmds:
      - task: check
      - task: cluster:create
      - task: cilium:install
      - task: infra:namespaces
      - task: infra:redis
      - task: infra:postgres
      - task: oauth2-proxy:secret
      - task: dbhub:secret
      - task: dbhub:deploy
      - |
        echo ""
        echo "=== Setup Complete ==="
        echo ""
        echo "Start port-forward:"
        echo "  sudo kubectl -n mcp-servers port-forward svc/dbhub-sidecar 80:4180"
        echo ""
        echo "Then open: http://dbhub.localhost"
        echo ""
        echo "Optional - apply NetworkPolicies:"
        echo "  task demo:netpol"

  # ===========================================================================
  # Cleanup
  # ===========================================================================
  clean:services:
    desc: Remove all deployed services (keep cluster)
    cmds:
      - echo "Cleaning up services..."
      - kubectl delete namespace mcp-servers --ignore-not-found
      - kubectl delete namespace mcp-auth --ignore-not-found
      - echo "Services cleaned up."

  clean:
    desc: Delete everything including the cluster
    cmds:
      - task: cluster:delete
