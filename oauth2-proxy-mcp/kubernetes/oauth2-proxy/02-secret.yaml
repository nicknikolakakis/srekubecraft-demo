# =============================================================================
# OAuth2-Proxy secrets
# Replace values before applying or use: task oauth2-proxy:secret
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secret
  namespace: mcp-auth
type: Opaque
stringData:
  client-id: "REPLACE_WITH_GITHUB_CLIENT_ID"
  client-secret: "REPLACE_WITH_GITHUB_CLIENT_SECRET"
  cookie-secret: "REPLACE_WITH_OPENSSL_RAND_BASE64_32"
