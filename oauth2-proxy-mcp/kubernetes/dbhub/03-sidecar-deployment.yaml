# =============================================================================
# DBHub MCP server with OAuth2-Proxy sidecar
# Pattern: OAuth2-Proxy :4180 → localhost:8080 (DBHub)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbhub-sidecar
  namespace: mcp-servers
  labels:
    app.kubernetes.io/name: dbhub-sidecar
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: taskfile
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dbhub-sidecar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dbhub-sidecar
    spec:
      containers:
        # OAuth2-Proxy sidecar: the only externally accessible container
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.1
          args:
            - --provider=github
            - --email-domain=*
            - --upstream=http://localhost:8080
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --cookie-secure=false
            - --cookie-samesite=lax
            - --cookie-expire=8h
            - --cookie-refresh=1h
            - --silence-ping-logging=true
            - --skip-auth-route=^/healthz$
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy-secret
                  key: cookie-secret
          ports:
            - containerPort: 4180
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

        # DBHub MCP server: only accessible via localhost
        - name: dbhub
          image: bytebase/dbhub:latest
          args:
            - --transport
            - http
            - --port
            - "8080"
          env:
            - name: DSN
              valueFrom:
                secretKeyRef:
                  name: dbhub-secret
                  key: dsn
          ports:
            - containerPort: 8080
              name: mcp
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: dbhub-sidecar
  namespace: mcp-servers
  labels:
    app.kubernetes.io/name: dbhub-sidecar
spec:
  selector:
    app.kubernetes.io/name: dbhub-sidecar
  ports:
    - port: 4180
      targetPort: http
      protocol: TCP
      name: http
