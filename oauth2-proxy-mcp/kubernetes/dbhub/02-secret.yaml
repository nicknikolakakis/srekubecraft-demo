# =============================================================================
# DBHub database connection secret
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: dbhub-secret
  namespace: mcp-servers
type: Opaque
stringData:
  dsn: "postgres://readonly_user:readonly_pass@postgres.mcp-auth.svc.cluster.local:5432/sampledb?sslmode=disable"
