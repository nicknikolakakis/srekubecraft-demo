# Runs the Karmada control plane only. 32443 is the karmada-apiserver NodePort.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: karmada-host
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - containerPort: 32443
        hostPort: 32443
        listenAddress: "127.0.0.1"
