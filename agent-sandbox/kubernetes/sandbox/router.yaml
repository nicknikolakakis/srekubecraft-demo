# Sandbox router: fronts exec/file traffic from the SDK into sandbox pods.
# Vendored from upstream v0.5.6 clients/python/agentic-sandbox-client/sandbox-router/sandbox_router.yaml
# Changes from upstream: image pinned to digest, replicas 1 (single-node kind),
# ALLOW_UNAUTHENTICATED_ROUTER=true (local testing only - never in production).
apiVersion: v1
kind: Service
metadata:
  name: sandbox-router-svc
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: sandbox-router
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-router-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-router
  template:
    metadata:
      labels:
        app: sandbox-router
    spec:
      containers:
        - name: router
          image: us-central1-docker.pkg.dev/k8s-staging-images/agent-sandbox/sandbox-router@sha256:beeef47f617ea0ae7648415be7a00cbcdf8160d58b7cc0f1f91f09a228dee4dc
          env:
            - name: PROXY_TIMEOUT_SECONDS
              value: "180"
            - name: WEBSOCKET_IDLE_TIMEOUT_SECONDS
              value: "3600"
            - name: WEBSOCKET_MAX_LIFETIME_SECONDS
              value: "86400"
            - name: WEBSOCKET_MAX_MESSAGE_BYTES
              value: "16777216"
            - name: WEBSOCKET_MAX_CONNECTIONS_PER_CLIENT
              value: "0"
            # local demo only: the router sits behind no auth on kind
            - name: ALLOW_UNAUTHENTICATED_ROUTER
              value: "true"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
