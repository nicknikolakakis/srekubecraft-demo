# The controller ships a per-template NetworkPolicy that only admits the
# router from agent-sandbox-system, but the Go SDK's port-forward mode needs
# the router in the claim namespace. NetworkPolicies are additive, so this
# grants the extra allow instead of fighting the controller-owned policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-local-router-to-sandboxes
  namespace: default
spec:
  podSelector:
    matchLabels:
      agents.x-k8s.io/created-by: controller
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: sandbox-router
      ports:
        - protocol: TCP
          port: 8888
