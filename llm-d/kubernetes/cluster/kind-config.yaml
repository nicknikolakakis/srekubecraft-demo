# =============================================================================
# Kind cluster for the llm-d distributed-inference demo (GPU-free)
# 1 control-plane + 2 workers
#  - worker (system):     Flux, llm-d router (Endpoint Picker + Envoy proxy)
#  - worker (inference):  the llm-d-inference-sim model servers. Simulates a
#                         GPU nodepool - the sim is a Go binary, no accelerator.
#  Cilium CNI, no kube-proxy.
#
# Sizing note: the whole stack sits well under 2 GB - the sim serves no model.
# 4 GB RAM allocated to Docker Desktop is plenty.
# =============================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: llm-d-demo
networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
  disableDefaultCNI: true
  kubeProxyMode: "none"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
    extraMounts:
      - hostPath: /tmp/llm-d-demo/control-plane
        containerPath: /var/local-path-provisioner

  # System workloads: Flux, llm-d router (EPP + Envoy proxy)
  - role: worker
    labels:
      workload: system
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload=system"
    extraMounts:
      - hostPath: /tmp/llm-d-demo/worker-system
        containerPath: /var/local-path-provisioner

  # Inference workloads: the sim model servers land here (simulates a GPU pool)
  - role: worker
    labels:
      workload: inference
      accelerator: sim
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "workload=inference,accelerator=sim"
    extraMounts:
      - hostPath: /tmp/llm-d-demo/worker-inference
        containerPath: /var/local-path-provisioner
